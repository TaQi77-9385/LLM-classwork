<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 0%, #1f2a44 0%, #0d1220 60%, #05070d 100%);
    color: #e8eefc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    padding: 16px;
  }

  h1 {
    font-size: 20px; font-weight: 600; letter-spacing: 4px;
    margin: 0; color: #9fb6ff; text-shadow: 0 0 18px rgba(110,150,255,.5);
  }

  .hud {
    display: flex; align-items: center; gap: 18px;
    font-size: 14px; color: #9aa8c7; letter-spacing: 1px;
  }
  .hud b { color: #7ef5c0; font-size: 18px; font-variant-numeric: tabular-nums; }
  .hud .best b { color: #ffd479; }

  .stage {
    position: relative;
    border-radius: 16px;
    padding: 10px;
    background: linear-gradient(160deg, rgba(120,150,255,.18), rgba(120,150,255,.04));
    box-shadow: 0 18px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(150,180,255,.18);
  }

  canvas {
    display: block;
    border-radius: 8px;
    background: #0b1020;
    box-shadow: inset 0 0 40px rgba(0,0,0,.8);
    touch-action: none;
  }

  .overlay {
    position: absolute; inset: 10px;
    border-radius: 8px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; text-align: center;
    background: rgba(6,10,20,.82);
    backdrop-filter: blur(3px);
    transition: opacity .18s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: 22px; color: #fff; letter-spacing: 2px; }
  .overlay p { margin: 0; font-size: 13px; line-height: 1.9; color: #93a3c6; }
  .overlay .score-line { font-size: 14px; color: #7ef5c0; }

  button {
    font: inherit; font-size: 15px; letter-spacing: 2px;
    padding: 11px 30px; border: 0; border-radius: 999px;
    color: #06131a; cursor: pointer;
    background: linear-gradient(135deg, #7ef5c0, #4ed3ff);
    box-shadow: 0 8px 22px rgba(78,211,255,.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(78,211,255,.5); }
  button:active { transform: translateY(1px) scale(.98); }

  .tips { font-size: 12px; color: #62708f; text-align: center; line-height: 1.8; }

  /* 移动端方向键 */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 8px;
  }
  .dpad button {
    width: 56px; height: 56px; padding: 0; border-radius: 14px;
    font-size: 20px; letter-spacing: 0;
    color: #9fb6ff;
    background: rgba(120,150,255,.12);
    box-shadow: inset 0 0 0 1px rgba(150,180,255,.22);
  }
  .dpad .up    { grid-area: 1 / 2; }
  .dpad .left  { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down  { grid-area: 3 / 2; }

  @media (max-width: 640px), (pointer: coarse) {
    .dpad { display: grid; }
    .tips { display: none; }
    h1 { font-size: 17px; }
  }
</style>
</head>
<body>

<h1>贪 吃 蛇</h1>

<div class="hud">
  <span>得分 <b id="score">0</b></span>
  <span class="best">最高 <b id="best">0</b></span>
  <span>速度 <b id="level">1</b></span>
</div>

<div class="stage">
  <canvas id="game"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">准备好了吗？</h2>
    <p id="ovDesc">
      方向键 / WASD 控制方向<br>
      空格暂停 · 回车重新开始
    </p>
    <button id="startBtn">开始游戏</button>
  </div>
</div>

<div class="dpad">
  <button class="up"    data-dir="up"    aria-label="上">▲</button>
  <button class="left"  data-dir="left"  aria-label="左">◀</button>
  <button class="right" data-dir="right" aria-label="右">▶</button>
  <button class="down"  data-dir="down"  aria-label="下">▼</button>
</div>

<div class="tips">方向键 / WASD 转向 · 空格暂停 · 回车重开 · 手机可滑动屏幕或点方向键</div>

<script>
(() => {
  'use strict';

  // ====== 基础配置 ======
  const COLS = 20;          // 横向格数
  const ROWS = 20;          // 纵向格数
  const CELL = 22;          // 每格像素（会按屏幕自动缩放）
  const BASE_SPEED = 140;   // 初始每步间隔（毫秒），越小越快
  const MIN_SPEED = 60;     // 最快速度上限
  const SPEED_STEP = 6;     // 每吃一个加速多少毫秒
  const MAX_CELL = 24;
  const MIN_CELL = 12;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovDesc = document.getElementById('ovDesc');
  const startBtn = document.getElementById('startBtn');

  // ====== 状态 ======
  let cell = CELL;
  let snake, dir, nextDir, food, score, best, stepMs, acc, lastTime;
  let state = 'idle';      // idle | running | paused | over
  let rafId = null;
  let flash = 0;           // 吃到食物的闪光效果

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function resize() {
    // 根据可视区域换算格子大小，保证一屏放得下
    const maxW = Math.min(window.innerWidth - 56, 560);
    const maxH = window.innerHeight - 260;
    cell = Math.floor(Math.min(maxW / COLS, Math.max(maxH, 240) / ROWS));
    cell = Math.max(MIN_CELL, Math.min(MAX_CELL, cell));
    const dpr = window.devicePixelRatio || 1;
    canvas.width = COLS * cell * dpr;
    canvas.height = ROWS * cell * dpr;
    canvas.style.width = COLS * cell + 'px';
    canvas.style.height = ROWS * cell + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx,     y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    stepMs = BASE_SPEED;
    acc = 0;
    lastTime = 0;
    flash = 0;
    placeFood();
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = Math.floor((BASE_SPEED - stepMs) / (SPEED_STEP * 2)) + 1;
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    if (!free.length) { food = null; return; }
    food = free[Math.floor(Math.random() * free.length)];
  }

  // ====== 游戏逻辑（按固定节奏推进） ======
  function step() {
    // 应用缓冲中的方向（禁止 180° 掉头）
    if (nextDir.x !== -dir.x || nextDir.y !== -dir.y) dir = nextDir;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return gameOver();
    // 撞自己（尾巴会移动，所以允许进入当前尾格）
    const willGrow = food && head.x === food.x && head.y === food.y;
    const body = willGrow ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (willGrow) {
      score += 10;
      flash = 1;
      stepMs = Math.max(MIN_SPEED, stepMs - SPEED_STEP);
      placeFood();
      if (!food) return win();
      if (score > best) {
        best = score;
        localStorage.setItem('snake-best', String(best));
      }
      updateHud();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    showOverlay('游戏结束', `本局得分 <span class="score-line">${score}</span><br>最高分 ${best}<br><br>回车 / 点击按钮再来一局`, '再来一局');
  }

  function win() {
    state = 'over';
    showOverlay('通关啦！', `你填满了整个棋盘，得分 <span class="score-line">${score}</span>`, '再来一局');
  }

  function showOverlay(title, desc, btnText) {
    ovTitle.textContent = title;
    ovDesc.innerHTML = desc;
    startBtn.textContent = btnText || '开始游戏';
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  // ====== 渲染 ======
  function draw() {
    const W = COLS * cell, H = ROWS * cell;
    ctx.clearRect(0, 0, W, H);

    // 棋盘格
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? 'rgba(255,255,255,0.022)' : 'rgba(255,255,255,0.045)';
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }

    // 食物（带呼吸光晕）
    if (food) {
      const t = performance.now() / 400;
      const pulse = 0.5 + 0.5 * Math.sin(t);
      const cx = food.x * cell + cell / 2;
      const cy = food.y * cell + cell / 2;
      const r = cell * (0.30 + 0.04 * pulse);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 0.9);
      g.addColorStop(0, 'rgba(255,110,140,.55)');
      g.addColorStop(1, 'rgba(255,110,140,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff6e8c';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.65)';
      ctx.beginPath();
      ctx.arc(cx - r * 0.3, cy - r * 0.35, r * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }

    // 蛇身：从头到尾渐变
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const p = i / Math.max(1, n - 1);
      const pad = Math.max(1, cell * 0.06);
      const x = s.x * cell + pad;
      const y = s.y * cell + pad;
      const size = cell - pad * 2;
      const radius = i === 0 ? size * 0.34 : size * 0.26;

      if (i === 0) {
        ctx.shadowColor = 'rgba(126,245,192,.85)';
        ctx.shadowBlur = cell * 0.7;
      } else {
        ctx.shadowBlur = 0;
      }
      // 头亮绿，尾部偏青蓝
      const l = 78 - p * 26;
      const h = 150 + p * 40;
      ctx.fillStyle = `hsl(${h}, 80%, ${l}%)`;
      roundRect(x, y, size, size, radius);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 眼睛 + 朝向
    if (snake.length) {
      const head = snake[0];
      const cx = head.x * cell + cell / 2;
      const cy = head.y * cell + cell / 2;
      const off = cell * 0.17;
      const er = Math.max(1.2, cell * 0.085);
      const ex = dir.x !== 0 ? dir.x * cell * 0.14 : 0;
      const ey = dir.y !== 0 ? dir.y * cell * 0.14 : 0;
      const nx = dir.x === 0 ? off : 0;
      const ny = dir.y === 0 ? off : 0;
      ctx.fillStyle = '#08131a';
      [[-1, 1], [1, -1]].forEach(([a, b]) => {
        ctx.beginPath();
        ctx.arc(cx + ex + nx * a + (dir.y !== 0 ? nx * b : 0),
                cy + ey + ny * a + (dir.x !== 0 ? ny * b : 0),
                er, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // 吃到食物的闪光
    if (flash > 0) {
      ctx.fillStyle = `rgba(126,245,192,${flash * 0.14})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ====== 主循环 ======
  function loop(now) {
    rafId = requestAnimationFrame(loop);
    if (!lastTime) lastTime = now;
    const dt = Math.min(now - lastTime, 250);
    lastTime = now;

    if (state === 'running') {
      acc += dt;
      while (acc >= stepMs) {
        acc -= stepMs;
        step();
        if (state !== 'running') break;
      }
    }
    if (flash > 0) flash = Math.max(0, flash - dt / 260);
    draw();
  }

  function start() {
    reset();
    state = 'running';
    hideOverlay();
    lastTime = 0;
    acc = 0;
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      showOverlay('已暂停', '空格 / 点击按钮继续', '继续游戏');
    } else if (state === 'paused') {
      state = 'running';
      hideOverlay();
      lastTime = 0;
    }
  }

  // ====== 输入 ======
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };
  const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

  function setDir(name) {
    const nd = DIRS[name];
    if (!nd) return;
    // 与当前方向相反则忽略（避免瞬间自杀）
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    // 不允许覆盖已排队但尚未生效的反向
    nextDir = nd;
  }

  window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (state === 'running' || state === 'paused') togglePause();
      else if (state !== 'running') start();
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      if (state !== 'running') start();
      return;
    }
    const name = KEYMAP[e.key];
    if (name) {
      e.preventDefault();
      if (state === 'running') setDir(name);
    }
  }, { passive: false });

  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state === 'running') setDir(btn.dataset.dir);
    });
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  // 触摸滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.hypot(dx, dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  // 失焦自动暂停
  window.addEventListener('blur', () => {
    if (state === 'running') togglePause();
  });

  // ====== 启动 ======
  window.addEventListener('resize', resize);
  reset();
  state = 'idle';
  resize();
  showOverlay('准备好了吗？', '方向键 / WASD 控制方向<br>空格暂停 · 回车重新开始', '开始游戏');
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
