<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上传文档到 AnythingLLM</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 48px auto; padding: 0 16px; }
    label { display: block; margin: 16px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; }
    button { margin-top: 16px; padding: 8px 16px; }
    pre { white-space: pre-wrap; background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h1>上传文档并向量化</h1>
  <p>上传到 AnythingLLM 的第一个工作区，并完成嵌入。</p>
  <form id="form">
    <label for="key">API Key</label>
    <input id="key" placeholder="请同学们自己在AnythingLLM中创建" autocomplete="off" />
    <label for="file">文档</label>
    <input id="file" type="file" required />
    <button type="submit">上传并嵌入</button>
  </form>
  <pre id="log">填写 Key 并选择文件后提交。</pre>
  <script>
    const BASE = "http://localhost:3001";
    const log = document.getElementById("log");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const key = document.getElementById("key").value.trim();
      const file = document.getElementById("file").files[0];
      if (!key) {
        log.textContent = "请填写 API Key。";
        return;
      }
      const headers = { Authorization: "Bearer " + key };
      const button = e.target.querySelector("button");
      button.disabled = true;
      try {
        log.textContent = "正在获取第一个工作区…";
        const wsRes = await fetch(BASE + "/api/v1/workspaces", { headers });
        const wsText = await wsRes.text();
        const wsData = JSON.parse(wsText);
        if (!wsRes.ok) throw new Error(wsText);
        const workspace = wsData.workspaces && wsData.workspaces[0];
        if (!workspace) throw new Error("没有可用的工作区。");

        log.textContent = "正在上传到「" + workspace.name + "」并向量化…";
        const body = new FormData();
        body.append("file", file);
        body.append("addToWorkspaces", workspace.slug);
        const upRes = await fetch(BASE + "/api/v1/document/upload", {
          method: "POST",
          headers,
          body,
        });
        log.textContent = await upRes.text();
      } catch (err) {
        log.textContent = String(err);
      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
